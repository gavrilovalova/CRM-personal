# Production stack on the server, project "prod". Started only by deploy/deploy.sh,
# which sets APP_IMAGE; database settings come from /opt/crm/prod/.env
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<version>
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies migrations from the new image and exits
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    command: ["node", "migrator/migrate.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["migrate"]

  app:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    ports:
      # Localhost only: Docker bypasses the firewall; nginx proxies app.relma.online here
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pgdata:
