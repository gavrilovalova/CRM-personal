# Push to main -> image tagged with the commit SHA -> GHCR -> deploy/deploy.sh on the server
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gavrilovalova/crm-personal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      SERVER: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy scripts to the server
        run: scp deploy/compose.yaml deploy/deploy.sh "$SERVER:/opt/crm/prod/"

      - name: Let the server pull the image from GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$SERVER" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy
        run: ssh "$SERVER" "bash /opt/crm/prod/deploy.sh ${{ github.sha }}"

      - name: Smoke check over https
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://app.relma.online/health
